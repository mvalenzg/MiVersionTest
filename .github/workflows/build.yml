name: Build .NET + Versioning

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "feat/**"
      - "release/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      semver: ${{ steps.gitversion.outputs.SemVer }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.11.0
        with:
          versionSpec: "5.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.11.0

      - name: Print Version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.SemVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.FullSemVer }}"
          echo "Branch: ${{ steps.gitversion.outputs.BranchName }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build API
        run: |
          dotnet build src/MyApi/MyApi.csproj \
          --configuration Release \
          /p:Version=${{ steps.gitversion.outputs.SemVer }}

      - name: Publish API
        run: |
          dotnet publish src/MyApi/MyApi.csproj \
          --configuration Release \
          --output ./publish \
          /p:Version=${{ steps.gitversion.outputs.SemVer }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ steps.gitversion.outputs.SemVer }}
          path: ./publish

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          TAG=v${{ needs.build.outputs.semver }}

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git tag $TAG
            git push origin $TAG
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.semver }}
          name: Release v${{ needs.build.outputs.semver }}
          generate_release_notes: true