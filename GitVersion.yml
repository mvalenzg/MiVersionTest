mode: ContinuousDelivery

next-version: 1.0.0

branches:
  main:
    regex: ^main$
    increment: Patch
    tag: ''
    is-main-branch: true

  dev:
    regex: ^dev(elop)?$
    increment: Minor
    tag: beta
    source-branches:
      - feature
      - release

  release:
    regex: ^release[/-]
    increment: Patch
    tag: rc
    is-release-branch: true
    source-branches:
      - dev

  feature:
    regex: ^feat[/-]|^feature[/-]
    increment: Minor
    tag: alpha
    source-branches:
      - dev